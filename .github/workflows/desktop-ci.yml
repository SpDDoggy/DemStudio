name: desktop-ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis
          - name: macOS Apple Silicon
            platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles app,dmg
          - name: macOS Intel
            platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles app,dmg
          - name: Linux x64
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu --bundles appimage,deb

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Static migration gate
        run: npm run verify

      - name: Build desktop bundle
        if: matrix.platform != 'ubuntu-22.04'
        uses: tauri-apps/tauri-action@v1
        with:
          args: ${{ matrix.args }}

      - name: Build Linux Debian package
        if: matrix.platform == 'ubuntu-22.04'
        run: npm run tauri -- build --target x86_64-unknown-linux-gnu --bundles deb

      - name: Build Linux AppImage
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          set +e
          set -o pipefail
          npm run tauri -- build \
            --target x86_64-unknown-linux-gnu \
            --bundles appimage \
            --verbose 2>&1 | tee tauri-linux-appimage.log
          status=${PIPESTATUS[0]}
          if (( status != 0 )); then
            message=$(tail -n 80 tauri-linux-appimage.log)
            message=${message//'%'/'%25'}
            message=${message//$'\r'/'%0D'}
            message=${message//$'\n'/'%0A'}
            echo "::error title=Linux AppImage bundle failed::$message"
            exit "$status"
          fi

      - name: Upload Linux bundle log
        if: failure() && matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: dem-studio-linux-bundle-log
          path: tauri-linux-appimage.log
          if-no-files-found: ignore

      - name: Upload unsigned bundles
        uses: actions/upload-artifact@v4
        with:
          name: dem-studio-${{ matrix.target }}
          path: src-tauri/target/**/release/bundle/**
          if-no-files-found: error
