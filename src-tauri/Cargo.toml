[package]
name = "dem-studio"
version = "0.12.1"
description = "Cross-platform terrain visualization and DEM rendering studio"
authors = ["DEM Studio"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "dem_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dem-core = { path = "dem-core" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
